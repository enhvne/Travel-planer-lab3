<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <button>Logo</button>
        </div>
        <div class="menu">
            <button class="wishlist">
                ❤️ Wishlist
            </button>
            <button class="profile">
                <img src="profile-icon.png" alt="Profile">
                ⌄
            </button>
        </div>
    </nav>

    <!-- HEADER -->
    <div class="header">
        <img src="./background.jpg" alt="Scenic Mongolia">
        <div class="search-bar">
            <input type="text" placeholder="Where to">
            <input type="text" placeholder="Select dates">
            <button>🔍</button>
        </div>
    </div>

    <!-- RECENTLY VIEWED -->
    <div class="section">
        <h2>Recently Viewed</h2>
        <div class="grid">
            <div class="card">
                <img src="./image3.jpg" alt="Otgon Tenger">
                <p>5.0 ⭐ Otgon Tenger Uul, Zavkhan</p>
            </div>
            <div class="card">
                <img src="./image2.jpg" alt="Khuvsgul Lake">
                <p>4.8 ⭐ Khuvsgul Lake, Khuvsgul</p>
            </div>
            <div class="card">
                <img src="./image1.jpg" alt="Gobi Desert">
                <p>4.9 ⭐ Gobi Desert, Umnugovi</p>
            </div>
        </div>
    </div>

    <!-- FAMOUS PROVINCES -->
    <div class="section">
        <h2>Famous Provinces</h2>
        <div class="grid">
            <div class="card"><img src="./image1.jpg" alt="Govi"><p>Govi</p></div>
            <div class="card"><img src="./image4.jpg" alt="Zavkhan"><p>Zavkhan</p></div>
            <div class="card"><img src="./image2.jpg" alt="Khuvsgul"><p>Khuvsgul</p></div>
            <div class="card"><img src="./similar1.jpg" alt="Arkhangai"><p>Arkhangai</p></div>
            <div class="card"><img src="./image2.jpg" alt="Uvs"><p>Uvs</p></div>
            <div class="card"><img src="./similar1.jpg" alt="Dornod"><p>Dornod</p></div>
        </div>
    </div>

    <!-- TOP VISIONS -->
    <div class="section">
        <h2>Top Visions</h2>
        <div class="grid">
            <div class="card"><img src="govi.jpg" alt="Gobi"><p>Gobi</p></div>
            <div class="card"><img src="otgon.jpg" alt="Otgon Tenger"><p>Otgon Tenger</p></div>
            <div class="card"><img src="tsambagarav.jpg" alt="Tsambagarav"><p>Tsambagarav</p></div>
            <div class="card"><img src="altai.jpg" alt="Altai Tavan Bogd"><p>Altai Tavan Bogd</p></div>
            <div class="card"><img src="uvs-lake.jpg" alt="Uvs Lake"><p>Uvs Lake</p></div>
            <div class="card"><img src="hovd-river.jpg" alt="Hovd River"><p>Hovd River</p></div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2025 Travel Planner</p>
    </footer>
</body>
</html>
