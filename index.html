<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <nav class="navbar">
            <div class="logo">
                <button>Logo</button>
            </div>
            <div class="menu">
                <button class="wishlist">
                    ❤️ Wishlist
                </button>
                <button class="profile">
                    <img src="profile-icon.png" alt="Profile">
                    ⌄
                </button>
            </div>
        </nav>
        <img src="./images/background.jpg" alt="Scenic Mongolia">
        <div class="search-bar">
            <input type="text" placeholder="Where to">
            <input type="text" placeholder="Select dates">
            <button>🔍</button>
        </div>
    </header>

    <div class="section">
        <h2>Recently Viewed</h2>
        <div class="grid">
            <div class="card">
                <img src="./images/image3.jpg" alt="Otgon Tenger">
                <p>5.0 ⭐ Otgon Tenger Uul, Zavkhan</p>
            </div>
            <div class="card">
                <img src="./images/image5.png" alt="Khuvsgul Lake">
                <p>4.8 ⭐ Khuvsgul Lake, Khuvsgul</p>
            </div>
            <div class="card">
                <img src="./images/image6.png" alt="Gobi Desert">
                <p>4.9 ⭐ Gobi Desert, Umnugovi</p>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Famous Provinces</h2>
        <div class="grid">
            <div class="card"><img src="./images/image1.jpg" alt="Govi"><p>Govi</p></div>
            <div class="card"><img src="./images/image4.jpg" alt="Zavkhan"><p>Zavkhan</p></div>
            <div class="card"><img src="./images/image2.jpg" alt="Khuvsgul"><p>Khuvsgul</p></div>
            <div class="card"><img src="./images/similar1.jpg" alt="Arkhangai"><p>Arkhangai</p></div>
            <div class="card"><img src="./images/similar2.jpg" alt="Uvs"><p>Uvs</p></div>
            <div class="card"><img src="./images/image5.png" alt="Dornod"><p>Dornod</p></div>
        </div>
    </div>

    <div class="section">
        <h2>Top Visions</h2>
        <div class="grid">
            <div class="card"><img src="./images/image1.jpg" alt="Gobi"><p>Gobi</p></div>
            <div class="card"><img src="./images/similar1.jpg" alt="Otgon Tenger"><p>Otgon Tenger</p></div>
            <div class="card"><img src="./images/image3.jpg" alt="Tsambagarav"><p>Tsambagarav</p></div>
            <div class="card"><img src="./images/similar3.jpg" alt="Altai Tavan Bogd"><p>Altai Tavan Bogd</p></div>
            <div class="card"><img src="./images/background.jpg" alt="Uvs Lake"><p>Uvs Lake</p></div>
            <div class="card"><img src="./images/image6.png" alt="Hovd River"><p>Hovd River</p></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Travel Planner</p>
    </footer>
</body>
</html>
