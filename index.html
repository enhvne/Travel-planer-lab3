<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <img src="hero-image.jpg" alt="Scenic Mongolia">
        <div class="search-bar">
            <input type="text" placeholder="Where to">
            <input type="text" placeholder="Select dates">
            <button>🔍</button>
        </div>
    </div>

    <div class="section">
        <h2>Recently Viewed</h2>
        <div class="grid">
            <div class="card">
                <img src="image1.jpg" alt="Location">
                <p>5.0 ⭐ Ottgontenger Uul, Zavkhan</p>
            </div>
            <div class="card">
                <img src="image2.jpg" alt="Location">
                <p>5.0 ⭐ Ottgontenger Uul, Zavkhan</p>
            </div>
            <div class="card">
                <img src="image3.jpg" alt="Location">
                <p>5.0 ⭐ Ottgontenger Uul, Zavkhan</p>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Famous Provinces</h2>
        <div class="grid">
            <div class="card"><p>Govi</p></div>
            <div class="card"><p>Zavkhan</p></div>
            <div class="card"><p>Khuvsgul</p></div>
            <div class="card"><p>Arkhangai</p></div>
            <div class="card"><p>Uvs</p></div>
            <div class="card"><p>Dornod</p></div>
        </div>
    </div>

    <div class="section">
        <h2>Top visions</h2>
        <div class="grid">
            <div class="card"><p>Govi</p></div>
            <div class="card"><p>Otgon Tenger</p></div>
            <div class="card"><p>Tsambgarav</p></div>
            <div class="card"><p>ALtai Tavan Bogd</p></div>
            <div class="card"><p>Uvs lake</p></div>
            <div class="card"><p>Hovd river</p></div>
        </div>
    </div>


    <footer>

    </footer>
</body>
</html>
