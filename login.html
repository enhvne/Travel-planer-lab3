<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <button>Logo</button>
            </div>
            <div class="menu">
                <button class="wishlist">
                    ❤️ Wishlist
                </button>
                <button class="profile">
                    <img src="profile-icon.png" alt="Profile">
                    ⌄
                </button>
            </div>
        </nav>
        <img src="./images/background.jpg" alt="Scenic Mongolia">
    </header>
    
    <div class="login-container">
        <h2>Log in and get exploring</h2>
        <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit" class="login-btn">Log in</button>
        </form>

        <div class="social-login">
            <button class="google"><img src="./images/google.png" alt="Google"></button>
            <button class="facebook"><img src="./images/fb.png" alt="Facebook"></button>
            <button class="apple"><img src="./images/apple.png" alt="Apple"></button>
        </div>
    </div>    

    <footer>
        <div class="extraItem">
            <div class="contact">
                <a href="#">Contact</a>
            </div>

            <div class="about_us">
                <a href="#">About us</a>
            </div>

            <div class="help_center">
                <a href="#">Help center</a>
            </div>
        </div>
        <p>&copy; 2025 Travel Planner</p>
    </footer>
</body>
</html>
