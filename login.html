<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <button>Logo</button>
        </div>
        <div class="menu">
            <button class="wishlist">
                ❤️ Wishlist
            </button>
            <button class="profile">
                <img src="profile-icon.png" alt="Profile">
                ⌄
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <img src="./images/background.jpg" alt="Scenic Mongolia">
        </div>

        <div class="login-container">
            <h2>Log in and get exploring</h2>
            <form>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <button type="submit" class="login-btn">Log in</button>
            </form>

            <div class="social-login">
                <button class="google"><img src="google.png" alt="Google"></button>
                <button class="facebook"><img src="facebook.png" alt="Facebook"></button>
                <button class="apple"><img src="apple.png" alt="Apple"></button>
            </div>
        </div>
    </div>
    

    <footer>
        <p>&copy; 2025 Travel Planner</p>
    </footer>
</body>
</html>
