<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup - Top Visions of Zavkhan</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container" >
        <!-- Header with navigation -->
        <nav class="top-nav">
            <div class="left-nav">
                <button class="logo-btn">Logo</button>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Zavkhan">
                    <button class="search-icon"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="right-nav">
                <button class="wishlist-btn"><i class="far fa-heart"></i> Wishlist</button>
                <button class="profile-btn"><i class="fas fa-user-circle"></i></button>
            </div>
        </nav>

        <!-- Auth Section -->
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-form-container">
                    <div class="auth-form">
                        <div class="auth-tabs">
                            <div class="auth-tab active" id="login-tab">Нэвтрэх</div>
                            <div class="auth-tab" id="signup-tab">Бүртгүүлэх</div>
                        </div>
                        
                        <!-- Login Form -->
                        <form id="login-form" class="login-form">
                            <div class="form-group">
                                <label for="login-email">И-мэйл</label>
                                <input type="email" id="login-email" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="login-password">Нууц үг</label>
                                <input type="password" id="login-password" required>
                            </div>
                            
                            <div class="remember-forgot">
                                <div class="remember-me">
                                    <input type="checkbox" id="remember">
                                    <label for="remember">Намайг сана</label>
                                </div>
                                <a href="#" class="forgot-password">Нууц үг мартсан?</a>
                            </div>
                            
                            <button type="submit" class="auth-btn">Нэвтрэх</button>
                            
                            <div class="auth-divider">
                                <div class="divider-line"></div>
                                <div class="divider-text">эсвэл</div>
                                <div class="divider-line"></div>
                            </div>
                            
                            <div class="social-login">
                                <button type="button" class="social-btn google-btn">
                                    <i class="fab fa-google"></i>
                                    Google
                                </button>
                                <button type="button" class="social-btn facebook-btn">
                                    <i class="fab fa-facebook-f"></i>
                                    Facebook
                                </button>
                            </div>
                            
                            <div class="auth-footer">
                                Бүртгэл байхгүй юу? <a href="#" class="signup-link" id="show-signup">Бүртгүүлэх</a>
                            </div>
                        </form>
                        
                        <!-- Signup Form (initially hidden) -->
                        <form id="signup-form" class="signup-form" style="display: none;">
                            <div class="form-group">
                                <label for="signup-name">Бүтэн нэр</label>
                                <input type="text" id="signup-name" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="signup-email">И-мэйл</label>
                                <input type="email" id="signup-email" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="signup-password">Нууц үг</label>
                                <input type="password" id="signup-password" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="signup-confirm">Нууц үг баталгаажуулах</label>
                                <input type="password" id="signup-confirm" required>
                            </div>
                            
                            <button type="submit" class="auth-btn">Бүртгүүлэх</button>
                            
                            <div class="auth-divider">
                                <div class="divider-line"></div>
                                <div class="divider-text">эсвэл</div>
                                <div class="divider-line"></div>
                            </div>
                            
                            <div class="social-login">
                                <button type="button" class="social-btn google-btn">
                                    <i class="fab fa-google"></i>
                                    Google
                                </button>
                                <button type="button" class="social-btn facebook-btn">
                                    <i class="fab fa-facebook-f"></i>
                                    Facebook
                                </button>
                            </div>
                            
                            <div class="auth-footer">
                                Аль хэдийн бүртгэлтэй юу? <a href="#" class="signup-link" id="show-login">Нэвтрэх</a>
                            </div>
                        </form>
                    </div>
                    
                    <div class="auth-image"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-pinterest"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-tiktok"></i></a>
            </div>
            
            <div class="subscription">
                <div class="email-bar">
                    <input type="email" placeholder="Email">
                    <button class="subscribe-btn">📧 Subscribe</button>
                </div>
            </div>
            
            <div class="footer-links">
                <div class="footer-column">
                    <h3>Help Center</h3>
                    <a href="#">Privacy and Cookie Statement</a>
                    <a href="#">Settings</a>
                </div>
                <div class="footer-column">
                    <h3>Careers</h3>
                    <a href="#">Terms and Conditions</a>
                </div>
                <div class="footer-column">
                    <h3>Travel Agents</h3>
                    <a href="#">Become an Affiliate</a>
                </div>
                <div class="footer-column">
                    <h3>Work Blog</h3>
                </div>
            </div>
        </footer>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
